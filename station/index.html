</script><script>(async()=>{const NL=String.fromCharCode(10);let s=window.__EMBED_STATE;try{const r=await fetch('state.json');if(r.ok)s=await r.json()}catch(e){}const t=x=>x?new Date(x).toLocaleString('en-US',{timeZone:'America/Los_Angeles',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' PT':'-';const la=s.last_action||{};document.getElementById('log').textContent='> LOG // FOMO AUTO'+NL+'['+t(s.last_scan_time)+'] scan: '+s.coins_seen+' seen, '+s.coins_passed+' passed ('+(s.passed||[]).join(', ')+')'+NL+'['+t(la.time)+'] action: '+(la.type||'-')+''+NL+'open positions: '+((s.open_positions||[]).length||'none')+''+NL+'status: '+(s.status||'-').toUpperCase();document.getElementById('tk').textContent='FOMO AUTO '+(s.status||'').toUpperCase()+'  ///  LAST SCAN '+t(s.last_scan_time)+'  ///  PASSED: '+(s.passed||[]).join(', ')+'  ///  '+(la.reason||'');})();</script></body></html>
